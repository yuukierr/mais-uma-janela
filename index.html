<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#04050a">
  <title>Mais uma janela</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><rect width='8' height='8' fill='%230b1026'/><rect x='2' y='2' width='4' height='4' fill='%23f2b66d'/></svg>">
  <style id="trava-css">
    html, body { margin: 0; min-height: 100%; background: #04050a; color: #f2e4d2; font: 17px/1.5 ui-monospace, Menlo, Consolas, monospace; }
    body { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; background: radial-gradient(ellipse at 50% 38%, #1a1c4a 0, #0a0b22 45%, #04050a 80%); }
    main { width: min(440px, 100% - 40px); text-align: center; padding: 24px 0; }
    .janela { width: 108px; height: 132px; margin: 0 auto 26px; border: 8px solid #6b463b; background: linear-gradient(#131a4a, #4a3378 70%, #8a4f86); display: grid; grid-template: 1fr 6px 1fr / 1fr 6px 1fr; transition: background 1s, box-shadow 1s; }
    .janela::before { content: ''; grid-area: 1 / 2 / 4 / 3; background: #6b463b; }
    .janela::after { content: ''; grid-area: 2 / 1 / 3 / 4; background: #6b463b; }
    .aberta .janela { background: linear-gradient(#ffd08a, #ffe9b8); box-shadow: 0 0 70px #ffc98788; }
    h1 { margin: 0; font-size: 25px; letter-spacing: 4px; font-weight: 600; }
    p { margin: 12px 0 22px; color: #9db4ec; }
    .campos { display: flex; justify-content: center; align-items: center; gap: 10px; }
    input { box-sizing: border-box; width: 72px; padding: 11px 0; font: inherit; font-size: 22px; text-align: center; color: #f2e4d2; background: #0a0c24; border: 2px solid #3a3f78; border-radius: 0; }
    #a { width: 104px; }
    input:focus { outline: none; border-color: #ffc987; }
    button { margin-top: 24px; padding: 11px 38px; font: inherit; color: #1a1020; background: #ffc987; border: 0; cursor: pointer; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    button:disabled { opacity: .5; cursor: default; }
    #msg { min-height: 26px; margin: 18px 0 0; color: #f0a8a0; }
    #msg.ok { color: #9db4ec; }
    .nota { margin: 26px 0 0; font-size: 13px; color: #6f7cb0; }
    .treme { animation: treme .35s; }
    @keyframes treme { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
    @media (prefers-reduced-motion: reduce) { .treme { animation: none; } }
  </style>
</head>
<body>
  <main id="trava">
    <div class="janela" aria-hidden="true"></div>
    <h1>MAIS UMA JANELA</h1>
    <p>Para abrir, a sua data de nascimento.</p>
    <form id="f" autocomplete="off" novalidate>
      <div class="campos">
        <input id="d" inputmode="numeric" maxlength="2" placeholder="dia" aria-label="Dia" autofocus>
        <input id="m" inputmode="numeric" maxlength="2" placeholder="mês" aria-label="Mês">
        <input id="a" inputmode="numeric" maxlength="4" placeholder="ano" aria-label="Ano">
      </div>
      <button id="b">Abrir</button>
    </form>
    <div id="msg" role="status"></div>
    <p class="nota">Melhor no computador, com som.</p>
  </main>
  <noscript>Este jogo precisa de JavaScript.</noscript>
  <script>
    (function () {
      'use strict';
      const $ = (i) => document.getElementById(i), fields = ['d', 'm', 'a'].map($), msg = $('msg');
      const secret = location.hash.slice(1);
      let file = null, busy = false;
      const load = () => (file = file || fetch('jogo.bin').then((r) => { if (!r.ok) throw new Error('rede'); return r.arrayBuffer(); }).catch((e) => { file = null; throw e; }));
      fields.forEach((el, i) => {
        el.addEventListener('input', () => {
          const v = el.value.replace(/\D/g, '');
          if (v.length >= 8) { // data colada inteira
            fields[0].value = v.slice(0, 2); fields[1].value = v.slice(2, 4); fields[2].value = v.slice(4, 8); return;
          }
          el.value = v.slice(0, +el.getAttribute('maxlength'));
          if (el.value.length === +el.getAttribute('maxlength') && fields[i + 1]) fields[i + 1].focus();
        });
        el.addEventListener('paste', (e) => {
          const v = (e.clipboardData.getData('text') || '').replace(/\D/g, '');
          if (v.length === 8) { e.preventDefault(); fields[0].value = v.slice(0, 2); fields[1].value = v.slice(2, 4); fields[2].value = v.slice(4); fields[2].focus(); }
        });
        el.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && !el.value && fields[i - 1]) fields[i - 1].focus(); });
      });
      const say = (t, ok) => { msg.textContent = t; msg.className = ok ? 'ok' : ''; };
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      async function open(pass) {
        const all = new Uint8Array(await load());
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: all.slice(0, 16), iterations: 1500000 }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        let plain;
        try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(16, 28) }, key, all.slice(28)); } catch (e) { return null; }
        return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
      }
      async function start(game) {
        document.body.classList.add('aberta');
        say('Abrindo a janela…', true);
        await wait(1300);
        $('trava').remove(); $('trava-css').remove();
        document.body.className = '';
        const css = document.createElement('style'); css.textContent = game.css; document.head.append(css);
        document.body.insertAdjacentHTML('afterbegin', game.body);
        for (const code of game.scripts) { const s = document.createElement('script'); s.textContent = code; document.body.append(s); s.remove(); }
        window.dispatchEvent(new Event('load'));
      }
      $('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (busy) return;
        const [d, m, a] = fields.map((x) => x.value);
        if (!d || !m || a.length !== 4) { say('Dia, mês e ano com quatro números.'); return; }
        if (!window.crypto || !crypto.subtle || !window.DecompressionStream) { say('Este navegador não consegue abrir. Tente um Chrome, Safari, Edge ou Firefox atualizado.'); return; }
        busy = true; $('b').disabled = true; say('Um instante…', true);
        try {
          const game = await open(d.padStart(2, '0') + m.padStart(2, '0') + a + '.' + secret);
          if (game) return await start(game);
          say('Não é essa. Tente de novo.');
          $('f').classList.remove('treme'); void $('f').offsetWidth; $('f').classList.add('treme');
        } catch (err) { say('Não deu para carregar. Confira a internet e tente de novo.'); }
        busy = false; $('b').disabled = false;
      });
      if (!secret) { document.querySelector('main p').textContent = 'Este link está incompleto. Abra o link inteiro que você recebeu.'; $('f').remove(); return; }
      window.addEventListener('hashchange', () => location.reload());
      load().catch(() => {});
    })();
  </script>
</body>
</html>
